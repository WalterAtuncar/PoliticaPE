version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Usar tu base de datos externa
      - DATABASE_URL=postgresql://postgres:123456@host.docker.internal:5432/politiscope_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      # Usar tu base de datos externa
      - DATABASE_URL=postgresql://postgres:123456@host.docker.internal:5432/politiscope_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      # Usar tu base de datos externa
      - DATABASE_URL=postgresql://postgres:123456@host.docker.internal:5432/politiscope_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Comentamos el servicio de PostgreSQL ya que usas tu BD externa
  # db:
  #   image: postgres:15
  #   environment:
  #     - POSTGRES_DB=political_data
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  #   ports:
  #     - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

